<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C111D">
<title>Rekap APD</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #0C111D; --surface: #141B2B; --surface-2: #1A2336; --line: #243049; --ink: #EEF2F8; --muted: #8C98AE; --faint: #5F6B82;
  --accent: #5B8DEF; --accent-soft: rgba(91, 141, 239, .16); --accent-ink: #07101F;
  --ok: #3DD68C; --ok-soft: rgba(61, 214, 140, .14);
  --one: #F5C451; --one-soft: rgba(245, 196, 81, .14);
  --apd: #FF9A3D; --apd-soft: rgba(255, 154, 61, .15);
  --miss: #FF6767; --miss-soft: rgba(255, 103, 103, .14);
  --off: #8592A8; --off-soft: rgba(133, 146, 168, .15);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nav-h: 74px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
body { font-size: 16px; line-height: 1.45; overscroll-behavior-y: none; }
body.terkunci { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.layar { max-width: 640px; margin: 0 auto; padding: 18px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
.layar.ada-bar { padding-bottom: calc(var(--nav-h) + 108px + env(safe-area-inset-bottom)); }
.muted { color: var(--muted); }
.kecil { font-size: 14px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }

/* kepala */
.kepala { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kepala .tgl { color: var(--muted); font-size: 15px; font-weight: 500; }
.kepala h1 { margin-top: 2px; font-size: 30px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; }
.btn-ikon { flex: none; width: 48px; height: 48px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.btn-ikon.kecil { width: 42px; height: 42px; border-radius: 14px; }
.berputar svg { animation: putar 1s linear infinite; }
@keyframes putar { to { transform: rotate(360deg); } }

/* tanggal */
.tgl-nav { display: flex; align-items: center; gap: 8px; }
.tgl-pil { position: relative; flex: 1; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }
.tgl-pil input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
.pil-btn { height: 42px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }

/* papan angka */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.tiles .tile { grid-column: span 2; }
.tiles .tile:nth-child(n+4) { grid-column: span 3; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; text-align: left; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile b { font-size: 30px; line-height: 1; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.tile[aria-pressed="true"] { border-color: var(--c); background: var(--cs); }
.k-ok { --c: var(--ok); --cs: var(--ok-soft); }
.k-one { --c: var(--one); --cs: var(--one-soft); }
.k-apd { --c: var(--apd); --cs: var(--apd-soft); }
.k-miss { --c: var(--miss); --cs: var(--miss-soft); }
.k-off { --c: var(--off); --cs: var(--off-soft); }
.k-belum { --c: var(--line); --cs: var(--surface-2); }

/* panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
.baris-antara { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.bar span { display: block; height: 100%; }
.s-ok { background: var(--ok); } .s-one { background: var(--one); } .s-apd { background: var(--apd); } .s-miss { background: var(--miss); }
.peringatan { border-color: rgba(255, 154, 61, .45); background: linear-gradient(0deg, var(--apd-soft), var(--apd-soft)), var(--surface); }
.fokus { display: grid; }
.fokus-baris { display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid var(--line); }
.fokus-baris i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.fokus-baris p { flex: 1; font-weight: 600; font-size: 15px; line-height: 1.3; }

/* cari */
.cari { display: flex; align-items: center; gap: 10px; height: 48px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; color: var(--muted); }
.cari input[type="text"] { flex: 1; min-width: 0; height: 100%; border: 0; border-radius: 0; background: transparent; padding: 0; outline: none; color: var(--ink); font-size: 16px; }

/* daftar tim */
.grup { display: grid; gap: 8px; }
.grup-judul { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px 0; }
.grup-judul h3 { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.grup-judul span { font-size: 13px; color: var(--faint); font-weight: 600; }
.tim { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 18px; overflow: hidden; }
.tim-utama { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 14px 12px 14px 14px; display: grid; gap: 8px; }
.tim-baris1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tim-nama { font-size: 17px; font-weight: 700; line-height: 1.25; }
.pill { flex: none; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--cs, var(--surface-2)); color: var(--c, var(--muted)); white-space: nowrap; }
.k-belum .pill { color: var(--muted); }
.tim-baris2 { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--faint); }
.mini.on { color: var(--ink); background: var(--accent-soft); }
.mini.on svg { color: var(--accent); }
.kurang { font-size: 13.5px; font-weight: 600; color: var(--apd); }
.tim-foto { flex: none; width: 56px; border: 0; border-left: 1px solid var(--line); background: var(--surface-2); color: var(--accent); display: grid; place-items: center; }

/* tombol umum */
.btn { min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.utama { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.bahaya { color: var(--miss); border-color: rgba(255, 103, 103, .4); background: transparent; }
.btn.kecil { min-height: 38px; padding: 0 12px; font-size: 13.5px; border-radius: 12px; }
.btn.besar { min-height: 56px; font-size: 16px; border-radius: 16px; }
.btn.penuh { width: 100%; }
.dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: 14px; }

/* chip APD */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--apd-soft); border-color: var(--apd); color: var(--apd); }
.label-kecil { font-size: 13px; font-weight: 700; color: var(--muted); }
.ai { font-size: 13.5px; color: var(--ink); background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; }

input[type="text"], input[type="date"], select, textarea, .catatan {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; color: var(--ink); outline: none;
}
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

/* antrean foto */
.antri { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: grid; gap: 12px; scroll-margin-top: 12px; }
.antri.ok { border-color: var(--ok); }
.antri.gagal { border-color: var(--miss); }
.antri-atas { display: grid; grid-template-columns: 112px 1fr; gap: 12px; }
.thumb-wrap { position: relative; }
.thumb { padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--surface-2); width: 112px; height: 148px; display: grid; place-items: center; color: var(--faint); font-size: 13px; }
.buang-q { position: absolute; top: 6px; left: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(5, 8, 14, .72); color: #fff; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.antri-kanan { display: grid; gap: 8px; align-content: start; min-width: 0; }
.pilih-tim { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); text-align: left; padding: 8px 12px; display: grid; }
.pilih-tim b { font-size: 15.5px; font-weight: 700; line-height: 1.25; }
.pilih-tim span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.pilih-tim.kosong { border-style: dashed; border-color: var(--accent); color: var(--accent); font-weight: 700; place-items: center start; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { min-height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tgl-q { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.tgl-q b { color: var(--ink); text-align: right; }
.tgl-q input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
.tgl-q.besar { min-height: 48px; border-radius: 14px; font-size: 15px; padding: 0 14px; }
.hint { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--one); font-weight: 600; }
.hint .link { font-size: 12.5px; }
.status-q { font-size: 13.5px; font-weight: 700; color: var(--muted); }
.status-q.ok { color: var(--ok); } .status-q.gagal { color: var(--miss); }
.bar-simpan { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 15; padding: 10px 16px; background: linear-gradient(180deg, rgba(12, 17, 29, 0), var(--bg) 35%); }
.bar-simpan .btn { max-width: 608px; margin: 0 auto; display: flex; width: 100%; min-height: 54px; font-size: 16px; }
.kosong-antre { text-align: center; padding: 24px 18px; color: var(--muted); }

/* teks WA */
.teks-wa { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font); font-size: 14px; line-height: 1.5; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; max-height: 240px; overflow: auto; }

/* rekap */
.bulan-nav { display: flex; align-items: center; gap: 8px; }
.angka-besar { display: flex; align-items: flex-end; gap: 14px; }
.angka-besar b { font-size: 60px; line-height: .9; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.batang { display: grid; grid-template-columns: minmax(82px, 118px) 1fr 50px; align-items: center; gap: 10px; font-size: 14px; }
.batang .nm { font-weight: 600; overflow-wrap: anywhere; }
.batang .isi { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.batang .isi span { display: block; height: 100%; border-radius: 5px; background: var(--c, var(--accent)); }
.batang .v { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.daftar-perhatian { display: grid; gap: 10px; }
.daftar-perhatian div { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.daftar-perhatian b { font-variant-numeric: tabular-nums; }
.matriks-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
.matriks { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.matriks th, .matriks td { height: 32px; padding: 0; text-align: center; border-bottom: 1px solid var(--line); }
.matriks thead th { color: var(--muted); font-weight: 700; min-width: 28px; background: var(--surface); }
.matriks thead th.nk { color: var(--faint); }
.matriks .m-tim { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 4px 10px; min-width: 120px; max-width: 150px; font-weight: 600; line-height: 1.2; border-right: 1px solid var(--line); }
.matriks .m-pct { min-width: 46px; font-weight: 800; border-right: 1px solid var(--line); }
.matriks .m-cab th { text-align: left; padding: 6px 10px; font-size: 11.5px; letter-spacing: .1em; color: var(--muted); background: var(--surface-2); }
.matriks .m-cab th:first-child { position: sticky; left: 0; z-index: 1; }
.matriks td.c { min-width: 28px; font-weight: 800; }
.c-L { background: var(--ok-soft); color: var(--ok); } .c-1 { background: var(--one-soft); color: var(--one); } .c-A { background: var(--apd-soft); color: var(--apd); }
.c-X { background: var(--miss-soft); color: var(--miss); } .c-off { background: var(--off-soft); color: var(--off); } .c-nk { color: var(--faint); background: rgba(255, 255, 255, .02); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legenda i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-weight: 800; margin-right: 5px; }

/* tim & libur */
.baris-tim { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.baris-tim:last-child { border-bottom: 0; }
.baris-tim small { display: block; color: var(--muted); font-size: 12.5px; }
.saklar { flex: none; width: 52px; height: 30px; border-radius: 15px; border: 0; background: var(--surface-2); position: relative; box-shadow: inset 0 0 0 1px var(--line); }
.saklar::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.saklar[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.saklar[aria-checked="true"]::after { transform: translateX(22px); background: #fff; }
.libur-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--off-soft); }

/* navigasi bawah */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #101625; border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
.nav-isi { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; padding: 4px 0; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.nav .ik { position: relative; width: 54px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] .ik { background: var(--accent-soft); }
.nav .tengah .ik { background: var(--accent); color: var(--accent-ink); }
.nav .tengah[aria-current="page"] .ik { box-shadow: 0 0 0 4px var(--accent-soft); background: var(--accent); }
.badge { position: absolute; top: -5px; right: 2px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--miss); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid #101625; }

/* lapisan: sheet + pratinjau */
.tirai { position: fixed; inset: 0; z-index: 40; background: rgba(3, 6, 12, .66); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; overflow: auto; overscroll-behavior: contain; background: var(--surface); border-top-left-radius: 26px; border-top-right-radius: 26px; border: 1px solid var(--line); padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet-isi { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.pegangan { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.entri { border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; background: var(--surface-2); }
.entri textarea { background: var(--surface); }
.entri .chip { background: var(--surface); }
.entri .chip.on { background: var(--apd-soft); }
.entri-atas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub-panel { display: grid; gap: 8px; padding: 12px 14px; border-radius: 16px; border: 1px dashed var(--line); }
.tag { font-size: 12px; font-weight: 800; letter-spacing: .06em; padding: 3px 9px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.entri-atas .link { margin-left: auto; }
.aksi-baris { display: flex; flex-wrap: wrap; gap: 8px; }
.aksi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pil-tim { width: 100%; text-align: left; min-height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pil-tim b { font-size: 15.5px; }
.pil-tim span { font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: right; }
.pil-tim.sudah span { color: var(--ok); }
.pratinjau { position: fixed; inset: 0; z-index: 50; background: #000; display: grid; place-items: center; }
.pratinjau img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pratinjau button { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom)); z-index: 60; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 14px; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
body.ada-bar .toast { bottom: calc(var(--nav-h) + 92px + env(safe-area-inset-bottom)); }
.memuat { display: grid; gap: 12px; }
.kerangka { height: 74px; border-radius: 18px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; }
@media (prefers-reduced-motion: no-preference) { .kerangka { animation: kilat 1.4s ease-in-out infinite; } }
@keyframes kilat { from { background-position: 100% 0; } to { background-position: -100% 0; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="lapisan"></div>
<div id="toast" aria-live="polite"></div>
<input type="file" id="in-galeri" accept="image/*" multiple class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="in-kamera" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="in-tim" accept="image/*" multiple class="sr" tabindex="-1" aria-hidden="true">
<script>
(function () {
  'use strict';
  // Opsional: isi alamat /exec Apps Script kalau aplikasi dibuka tanpa parameter ?api= (misalnya dari menu bot).
  var API_URL_TETAP = '';

  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  var diTelegram = !!(tg && tg.initData);

  function tutupLapisan() { if (!S.lapisan) return; S.lapisan = null; render(true); }

  /* ---------- render ---------- */

    return ae.tagName === 'INPUT' && (ae.type === 'text' || ae.type === 'search');
  }
  function render(paksa) {
    if (!paksa && sedangMengetik()) { tundaRender = true; return; }
    tundaRender = false;
    var ae = document.activeElement, fid = ae && ae.id ? ae.id : null, selA = null, selB = null;
    try { if (fid && typeof ae.selectionStart === 'number') { selA = ae.selectionStart; selB = ae.selectionEnd; } } catch (e) { selA = null; }
    var sheet = document.getElementById('sheet'), scrollSheet = sheet ? sheet.scrollTop : 0;
    var isi;
    if (!S.siap) isi = S.err ? '<section class="panel"><h2>Belum bisa dibuka</h2><p class="muted">' + esc(S.err) + '</p>' + (diTelegram ? '<button class="btn utama" data-act="ulang">Coba lagi</button>' : '') + '</section>' : memuat(5);
    else isi = S.tab === 'catat' ? viewCatat() : S.tab === 'kirim' ? viewKirim() : S.tab === 'rekap' ? viewRekap() : S.tab === 'tim' ? viewTim() : viewHari();

    document.getElementById('app').innerHTML = '<main class="layar' + (adaBar ? ' ada-bar' : '') + '">' + kepala() + isi + '</main>' + (S.siap ? nav() : '');
    document.getElementById('lapisan').innerHTML = lapisanHtml();
    document.body.classList.toggle('terkunci', !!S.lapisan);
    document.body.classList.toggle('ada-bar', adaBar);
    var sheetBaru = document.getElementById('sheet');
    if (sheetBaru && scrollSheet) sheetBaru.scrollTop = scrollSheet;
    if (fid) {
      var el = document.getElementById(fid);
      if (el && el !== ae && el.focus) {
        try { el.focus({ preventScroll: true }); if (selA != null && el.setSelectionRange) el.setSelectionRange(selA, selB); } catch (e) { /* abaikan */ }
      }
    }
    try { if (tg && tg.BackButton && diTelegram) { if (S.lapisan) tg.BackButton.show(); else tg.BackButton.hide(); } } catch (e) { /* abaikan */ }
    var adaAntre = S.antre.some(function (it) { return it.status !== 'ok'; });
    if (tg && diTelegram && adaAntre !== render.tahan) {
      render.tahan = adaAntre;

    }
  }

  /* ---------- aksi ---------- */
  function cariEntri(id) {
    var hasil = null;
    if (S.hari) S.hari.rows.forEach(function (r) { r.entri.forEach(function (x) { if (x.id === id) hasil = x; }); });
    return hasil;
  }
  function simpanKurangNanti(id) {
    clearTimeout(timerKurang[id]);
    timerKurang[id] = setTimeout(async function kirim() {
      if (S.sibuk['entri-' + id]) { timerKurang[id] = setTimeout(kirim, 400); return; }
      var kurang = S.kurangLokal[id];
      if (!kurang) return;
      S.sibuk['entri-' + id] = true; render();
      try {
        var r = await api('ubah', { id: id, kurang: kurang, lihat: S.tgl });
        if (S.kurangLokal[id] === kurang) delete S.kurangLokal[id];
        pakaiHari(r.hari);
      } catch (e) { getar('gagal'); toast(e.message); delete S.kurangLokal[id]; }
      finally { S.sibuk['entri-' + id] = false; render(); }
    }, 700);
  }
  function gantiTanggal(tgl) {
    if (!tgl || !/^\d{4}-\d{2}-\d{2}$/.test(tgl)) return;
    if (tgl > S.hariIni) tgl = S.hariIni;
    if (tgl === S.tgl) return;
    S.tgl = tgl; S.hari = null; S.errHari = ''; S.filter = null; S.teks = null; S.errTeks = '';

    muatHari();
  }
  function aturTglAntre(tgl) {

  }

  document.addEventListener('click', function (ev) {

      case 'ulang': S.err = ''; render(true); mulai(); break;
      case 'muat-hari': S.errHari = ''; muatHari(); break;
      case 'muat-teks': S.errTeks = ''; render(true); break;
      case 'muat-bulan': S.errBulan = ''; render(true); break;

        S.tab = el.getAttribute('data-tab'); S.lapisan = null; getar(); render(true); window.scrollTo(0, 0); break;
      case 'segarkan':
        if (S.tab === 'kirim') { S.teks = null; S.errTeks = ''; render(true); }

        else muatHari();
        break;
      case 'filter': {
        var k = el.getAttribute('data-k');
        S.filter = k && S.filter !== k ? k : null; getar(); render(true); break;
      }
      case 'set-filter': {
        S.filter = el.getAttribute('data-k'); getar(); render(true);

      case 'tgl': gantiTanggal(geser(S.tgl, Number(el.getAttribute('data-n')))); break;
      case 'tgl-hariini': gantiTanggal(S.hariIni); break;

      case 'buka-pilih': S.cariPilih = ''; S.lapisan = { jenis: 'pilih', mode: el.getAttribute('data-mode'), id: id }; render(true); break;
      case 'pilih': {

        break;
      }
      case 'salin': salin(S.teks[el.getAttribute('data-k')]); break;
      case 'wa': buka('https://wa.me/?text=' + encodeURIComponent(S.teks[el.getAttribute('data-k')])); break;
      case 'ke-chat': {
        var kc = el.getAttribute('data-k'), judul = { pagi: 'Pengingat foto pagi', lapangan: 'Pengingat foto lapangan', rekap: 'Rekap harian' }[kc];
        jalan('chat-' + kc, async function () { await api('kirimTeks', { judul: judul, teks: S.teks[kc] }); getar('ok'); toast('Terkirim ke chat bot, tinggal diteruskan'); });
        break;
      }
      case 'bulan': {
        var nb = tambahBulan(S.ym, Number(el.getAttribute('data-n')));
        if (nb > S.hariIni.slice(0, 7)) return;
        S.ym = nb; S.bulan = null; S.errBulan = ''; render(true); break;
      }
      case 'excel': jalan('excel', async function () { await api('excel', { ym: S.ym }); getar('ok'); toast('File Excel dikirim ke chat bot'); }); break;
      case 'salin-bulan': salin(S.bulan.teks); break;
      case 'wa-bulan': buka('https://wa.me/?text=' + encodeURIComponent(S.bulan.teks)); break;
    }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target, k = el.getAttribute && el.getAttribute('data-input');
    if (!k) return;
    if (k === 'cari' || k === 'cari-pilih') {
      var q = el.value.trim().toLowerCase(), wadah = document.getElementById(k === 'cari' ? 'app' : 'lapisan');
      if (k === 'cari') S.cari = el.value; else S.cariPilih = el.value;
      wadah.querySelectorAll('[data-cari]').forEach(function (n) { n.hidden = !cocok(n.getAttribute('data-cari'), q); });
      wadah.querySelectorAll('[data-grup]').forEach(function (g) { g.hidden = !g.querySelector('[data-cari]:not([hidden])'); });
    } else if (k === 'q-cat') { var it = antreById(el.getAttribute('data-id')); if (it) it.catatan = el.value.slice(0, 300); }
    else if (k === 'cat-entri') {
      var eid = el.getAttribute('data-id'), awal = S.catLokal[eid] == null;
      S.catLokal[eid] = el.value.slice(0, 300);
      if (awal) { // munculkan tombol Simpan tanpa merusak ketikan
        var baris = el.parentNode.querySelector('.aksi-baris');
        if (baris && !baris.querySelector('[data-act="simpan-cat"]')) baris.insertAdjacentHTML('afterbegin', '<button class="btn kecil utama" data-act="simpan-cat" data-id="' + esc(eid) + '">Simpan catatan</button>');
      }
    }
    else if (k === 'form') S.form[el.getAttribute('data-f')] = el.value;
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.id === 'pilih-tgl') gantiTanggal(el.value);
    else if (el.id === 'tgl-catat') {
      if (/^\d{4}-\d{2}-\d{2}$/.test(el.value) && el.value <= S.hariIni) { S.tglCatat = el.value; aturTglAntre(el.value); render(true); }
    }
    else if (el.id === 'in-galeri' || el.id === 'in-kamera') { tambahFile(el.files, '', ''); el.value = ''; }
    else if (el.id === 'in-tim') { var f = fotoUntuk || {}; fotoUntuk = null; tambahFile(el.files, f.timId, f.tgl); el.value = ''; }
    else if (el.getAttribute('data-tgl-q')) {
      var it = antreById(el.getAttribute('data-tgl-q'));
      if (it && /^\d{4}-\d{2}-\d{2}$/.test(el.value) && el.value <= S.hariIni) { it.tgl = el.value; if (it.timId) it.jenis = jenisOtomatis(it.timId, it.tgl, it.id); render(true); }
    } else if (el.getAttribute('data-input') === 'form') { S.form[el.getAttribute('data-f')] = el.value; }
  });
  document.addEventListener('focusout', function () {
    if (tundaRender) setTimeout(function () { if (tundaRender && !sedangMengetik()) render(); }, 250);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.siap && S.tab === 'hari' && !S.lapisan && Date.now() - S.terakhirMuat > 60000) muatHari();
  });

  /* ---------- mulai ---------- */
  async function mulai() {
    if (tg) {
      try {
        tg.ready(); tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0C111D');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0C111D');
        if (tg.setBottomBarColor) tg.setBottomBarColor('#101625');
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        if (tg.BackButton && !mulai.back) { tg.BackButton.onClick(tutupLapisan); mulai.back = true; }
      } catch (e) { /* versi Telegram lama */ }
    }
    render(true);
    if (!diTelegram) { S.err = 'Buka aplikasi ini dari tombol "Buka aplikasi APD" di bot Telegram.'; render(true); return; }
    try {
      var d = await api('init');
      S.siap = true; S.err = ''; S.nama = d.nama; S.hariIni = d.hariIni; S.jamTutup = d.jamTutup; S.hariKerja = d.hariKerja; S.ai = d.ai;
      S.items = d.items && d.items.length ? d.items : ITEM_BAWAAN; S.tims = d.tims; S.tgl = d.hariIni; S.hari = d.hari; S.ym = d.hariIni.slice(0, 7);
      S.terakhirMuat = Date.now();
    } catch (e) { S.err = e.message; }
    render(true);
  }
  mulai();
})();
</script>
</body>
</html>
